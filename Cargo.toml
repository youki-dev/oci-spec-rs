[package]
name = "oci-spec"
version = "0.10.0"
edition = "2021"
authors = [
    "Furisto",
    "Sascha Grunert <sgrunert@redhat.com>",
    "Toru Komatsu <k0ma@utam0k.jp>",
]
description = "Open Container Initiative Specifications in Rust"
documentation = "https://docs.rs/oci-spec"
readme = "README.md"
homepage = "https://github.com/youki-dev/oci-spec-rs"
repository = "https://github.com/youki-dev/oci-spec-rs"
license = "Apache-2.0"
keywords = ["oci", "spec", "container", "runtime", "image"]
categories = ["api-bindings"]

[package.metadata.docs.rs]
# Document `parse_normalizing_host`, which needs the `idna` feature.
features = ["idna"]

[features]
default = ["distribution", "image", "runtime"]
proptests = ["quickcheck"]
distribution = []
image = []
runtime = []
# Adds `distribution::Reference::parse_normalizing_host`, which normalizes the
# registry host with IDNA, so Unicode hosts are accepted, e.g. `Bücher.Example` to
# `xn--bcher-kva.example`. Normal parsing (`str::parse` / `Reference::try_from`)
# does not change.
idna = ["dep:idna", "distribution"]

[dependencies]
const_format = "0.2"
serde = { version = "1.0.129", features = ["derive"] }
thiserror = "2.0.0"
serde_json = "1.0.66"
quickcheck = { version = "1.0.3", optional = true }
derive_builder = "0.20.0"
getset = "0.1.3"
strum = "0.27.0"
strum_macros = "0.27.0"
idna = { version = "1.1", optional = true }

[dev-dependencies]
tempfile = "3.23.0"
rstest = "0.26.1"
regex = "1"
serde_json = { version = "1.0.66", features = ["preserve_order"] }
